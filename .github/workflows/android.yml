name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JVM tests, lint, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Install compilation SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile, test, and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload JVM and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          retention-days: 7

  demo:
    name: Verified debug/demo APK
    needs: [build, instrumentation]
    if: >-
      github.repository == 'gurhangure/taskpilot-android' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Install compilation SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # Rebuild the same revision after all gates, without uploading an intermediate APK before tests pass.
      - name: Build standard demo without endpoint overrides
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Prepare and verify signed demo APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/taskpilot-android-debug-demo.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/taskpilot-android-debug-demo.apk
      - name: Upload installable debug/demo APK
        uses: actions/upload-artifact@v4
        with:
          name: taskpilot-android-debug-demo-apk
          path: app/build/outputs/apk/debug/taskpilot-android-debug-demo.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Emulator ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [component, e2e]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Install compilation SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable emulator acceleration on the hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.gurhangure.taskpilot.${{ matrix.suite }} --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ matrix.suite }}-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
